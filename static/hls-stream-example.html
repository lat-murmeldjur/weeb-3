<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>weeb-3 npm HLS stream example</title>
    <script type="importmap">
      {
        "imports": {
          "hls.js": "https://cdn.jsdelivr.net/npm/hls.js@1.6.2/dist/hls.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        margin: 0;
      }
      header {
        padding: 1rem;
      }
      header p {
        max-width: 72ch;
      }
      main {
        padding: 0 1rem 1rem;
      }
      video {
        display: block;
        width: min(100%, 72rem);
        max-height: 75vh;
        background: #000;
      }
      nav {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Swarm HLS stream</h1>
      <p>
        This page owns its video element and passes it to the npm client. The
        same Rust runtime, connections, retrieval, prefetch and player used by
        weeb-3 run underneath it.
      </p>
      <p id="status" role="status">Loading the weeb-3 npm client...</p>
    </header>
    <main>
      <video id="stream" controls autoplay muted playsinline></video>
      <nav aria-label="Stream position">
        <button id="beginning" type="button">From beginning</button>
        <button id="live" type="button">Live</button>
      </nav>
    </main>

    <script type="module">
      import init, { Weeb3No103 } from "./weeb_3.js";

      const owner = "6F2728386F8a47ef5EBe323721188e630Ff0FdE9";
      const topic = "b347b89b-933c-424f-a3d1-403bdd270b25";
      const status = document.getElementById("status");
      const video = document.getElementById("stream");
      let attachRequest = 0;

      try {
        await init();
        const node = new Weeb3No103();
        node.start();

        async function attach(start) {
          const request = ++attachRequest;
          status.textContent = `Opening the stream from ${start}...`;
          try {
            await node.attachStream(video, owner, topic, start);
            if (request === attachRequest) {
              status.textContent = `Stream attached from ${start}; loading playback...`;
            }
          } catch (error) {
            if (request === attachRequest) {
              status.textContent = `Could not open the stream: ${error.message || error}`;
              console.error(error);
            }
          }
        }

        document.getElementById("beginning").onclick = () => attach("beginning");
        document.getElementById("live").onclick = () => attach("live");
        await attach("beginning");
      } catch (error) {
        status.textContent = `Could not initialize weeb-3: ${error.message || error}`;
        console.error(error);
      }
    </script>
  </body>
</html>
