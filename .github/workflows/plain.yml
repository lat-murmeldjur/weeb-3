name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Build unified Wasm and npm package
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE || github.repository_owner }}
        run: |
          set -euo pipefail
          RUSTFLAGS='--cfg getrandom_backend="wasm_js"' wasm-pack build --target web --out-dir static --out-name weeb_3 --scope "$NPM_SCOPE"
          git restore static/.gitignore
          cp README.npm.md static/README.md
          cd static
          npm pkg delete files sideEffects exports keywords publishConfig || true
          npm pkg set \
            name="@${NPM_SCOPE}/weeb_3" \
            description="A Swarm client for browsers" \
            main="./weeb_3.js" \
            module="./weeb_3.js" \
            types="./weeb_3.d.ts" \
            repository.type="git" \
            repository.url="git+https://github.com/lat-murmeldjur/weeb-3.git" \
            bugs.url="https://github.com/lat-murmeldjur/weeb-3/issues" \
            homepage="https://github.com/lat-murmeldjur/weeb-3#readme" \
            publishConfig.access="public" \
            publishConfig.registry="https://registry.npmjs.org/"
          npm pkg set \
            files[0]="snippets" \
            files[1]="weeb_3.d.ts" \
            files[2]="weeb_3.js" \
            files[3]="weeb_3_bg.wasm" \
            files[4]="weeb_3_bg.wasm.d.ts" \
            files[5]="service.js" \
            files[6]="worker.js" \
            sideEffects[0]="./snippets/**/*" \
            keywords[0]="bee" \
            keywords[1]="browser" \
            keywords[2]="swarm" \
            keywords[3]="wasm" \
            keywords[4]="webassembly" \
            'exports[.].types=./weeb_3.d.ts' \
            'exports[.].import=./weeb_3.js' \
            'exports[.].default=./weeb_3.js' \
            'exports[./service.js].default=./service.js' \
            'exports[./worker.js].default=./worker.js' \
            'dependencies[hls.js]=^1.6.2'
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            BASE_VERSION="$(node -p "require('./package.json').version.split('-')[0]")"
            RELEASE_VERSION="$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); const run = Number(process.argv[2]); const attempt = Number(process.argv[3]); console.log([major, minor, patch + run * 1000 + attempt].join('.'))" "$BASE_VERSION" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")"
            npm version "$RELEASE_VERSION" --no-git-tag-version
          fi
      - name: Build native server with the generated Wasm
        run: cargo build --verbose
      - name: Test Bee compatibility and transfer contracts
        run: cargo test --tests -- --skip weeb3_loads_in_browser
      - name: Pack npm release
        run: npm pack ./static
      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"

  publish-npm:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download npm package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./package/*.tgz --access public
