<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>weeb-3 npm HLS stream example</title>
    <script type="importmap">
      {
        "imports": {
          "hls.js": "https://cdn.jsdelivr.net/npm/hls.js@1.6.2/dist/hls.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        box-sizing: border-box;
        margin: 0;
      }
      header {
        padding: 1rem;
      }
      header p {
        max-width: 72ch;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Swarm HLS stream</h1>
      <p>
        The JavaScript below selects the canonical stream route, then mounts the
        bundled Rust interface into the <code>weeb3</code> element. The mounted
        interface owns the player while the surrounding page remains under the
        application's control.
      </p>
      <p id="status" role="status">Loading the weeb-3 npm client...</p>
    </header>
    <main id="weeb3"></main>

    <script type="module">
      import init, { Weeb3No103 } from "./weeb_3.js";

      const owner = "6F2728386F8a47ef5EBe323721188e630Ff0FdE9";
      const topic = "b347b89b-933c-424f-a3d1-403bdd270b25";
      const streamPath = `/weeb-3/stream/${owner}/${encodeURIComponent(topic)}`;
      const status = document.getElementById("status");

      try {
        history.replaceState(null, "", streamPath);
        await init();

        const node = new Weeb3No103();
        const mount = document.getElementById("weeb3");
        const result = node.renderInterface(mount);

        if (result?.status !== "ok") {
          throw new Error(result?.error || "Could not mount the weeb-3 interface");
        }
        status.textContent = `Mounted the stream at ${streamPath}`;
      } catch (error) {
        status.textContent = `Could not open the stream: ${error.message || error}`;
        console.error(error);
      }
    </script>
  </body>
</html>
